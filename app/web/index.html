<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IPTV Manager</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/ui/">IPTV <span>MANAGER</span></a>
    <div class="search-wrap"><input id="search" type="search" placeholder="Buscar películas o series…" autocomplete="off"><button id="searchBtn">Buscar</button></div>
    <div id="health" class="health">● conectando</div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <nav>
        <button class="nav active" data-view="home">⌂ Inicio</button>
        <button class="nav" data-view="movies">🎬 Películas</button>
        <button class="nav" data-view="series">📺 Series</button>
        <button class="nav" data-view="categories">▦ Categorías</button>
      </nav>
      <div class="side-note">Catálogo servido desde la BD local. Xtream solo interviene en la sincronización.</div>
    </aside>
    <main id="main" class="main"><div class="loading">Cargando catálogo…</div></main>
  </div>
  <script src="/ui/app.js"></script>
</body>
</html>
