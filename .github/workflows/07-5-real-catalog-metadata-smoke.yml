name: 07-5 - Real Catalog Metadata Smoke Test

on:
  workflow_dispatch:
    inputs:
      series_limit:
        description: 'Series to process'
        required: true
        default: '25'
        type: string
      movie_limit:
        description: 'Movies to process'
        required: true
        default: '25'
        type: string
      diagnostic:
        description: 'Show candidate scoring'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore persistent DB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data candidates
          mkdir -p data candidates
          found=0
          validate() {
            DB="$1" python - <<'PY'
          import os, sqlite3, sys
          db=os.environ['DB']
          required={'providers','categories','content','seasons','episodes','versions','streams','series_sources'}
          with sqlite3.connect(db) as con:
              integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
              tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing=required-tables
          print(f'integrity_check={integrity}; missing={sorted(missing)}')
          if integrity!='ok' or missing: sys.exit(1)
          PY
          }
          for workflow_artifact in iptv-manager-v070-enriched iptv-manager-v031-catalog iptv-manager-v03-catalog; do
            for run in $(gh run list --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
              rm -rf candidates/*
              if gh run download "$run" --name "$workflow_artifact" --dir candidates >/dev/null 2>&1; then
                db=$(find candidates -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit || true)
                if [ -n "$db" ] && validate "$db"; then cp "$db" data/iptv_manager.db; found=1; break 2; fi
              fi
            done
          done
          test "$found" -eq 1
          echo "DB restored: $(du -h data/iptv_manager.db | cut -f1)"

      - name: Run automated tests
        run: python -m pytest -q tests --disable-warnings --maxfail=1

      - name: Smoke test series resolver
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_LANGUAGE: es-ES
          DATABASE_PATH: data/iptv_manager.db
        run: |
          set -euo pipefail
          args="--type series --limit ${{ inputs.series_limit }} --diagnostic"
          if [ "${{ inputs.diagnostic }}" != "true" ]; then args="--type series --limit ${{ inputs.series_limit }}"; fi
          python scripts/enrich_tmdb.py $args

      - name: Smoke test movie resolver
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_LANGUAGE: es-ES
          DATABASE_PATH: data/iptv_manager.db
        run: |
          set -euo pipefail
          args="--type movie --limit ${{ inputs.movie_limit }} --diagnostic"
          if [ "${{ inputs.diagnostic }}" != "true" ]; then args="--type movie --limit ${{ inputs.movie_limit }}"; fi
          python scripts/enrich_tmdb.py $args

      - name: Smoke test episode fallback
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_LANGUAGE: es-ES
          DATABASE_PATH: data/iptv_manager.db
        run: python scripts/enrich_tmdb_episodes.py --limit 25 --refresh --diagnostic
