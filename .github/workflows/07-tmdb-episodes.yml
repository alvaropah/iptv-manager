name: 07 - TMDB Episode Enrichment
run-name: TMDB Episode Enrichment v0.7

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of episodes to enrich'
        required: false
        default: '200'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  enrich-episodes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restaurar BD persistente
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data candidates
          mkdir -p data candidates
          found=0
          validate() {
            DB="$1" python - <<'PY'
          import os, sqlite3, sys
          db=os.environ['DB']
          required={'providers','categories','content','seasons','episodes','versions','streams','series_sources'}
          with sqlite3.connect(db) as con:
              integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
              tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing=required-tables
          print(f'integrity_check={integrity}; missing={sorted(missing)}')
          if integrity!='ok' or missing: sys.exit(1)
          PY
          }
          for run in $(gh run list --workflow 07-tmdb-episodes.yml --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
            rm -rf candidates/*
            echo "Probando enriquecimiento persistente: $run"
            if gh run download "$run" --name iptv-manager-v070-enriched --dir candidates >/dev/null 2>&1; then
              db=$(find candidates -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit || true)
              if [ -n "$db" ] && validate "$db"; then
                cp "$db" data/iptv_manager.db
                found=1
                break
              fi
            fi
          done
          if [ "$found" -eq 0 ]; then
            for run in $(gh run list --workflow 03-1-sync-persistent.yml --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
              rm -rf candidates/*
              echo "Probando catálogo persistente: $run"
              if gh run download "$run" --name iptv-manager-v031-catalog --dir candidates >/dev/null 2>&1; then
                db=$(find candidates -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit || true)
                if [ -n "$db" ] && validate "$db"; then
                  cp "$db" data/iptv_manager.db
                  found=1
                  break
                fi
              fi
            done
          fi
          test "$found" -eq 1
          echo "BD restaurada: $(du -h data/iptv_manager.db | cut -f1)"

      - name: Inicializar esquema de metadata
        env:
          DATABASE_PATH: data/iptv_manager.db
        run: |
          python - <<'PY'
          from app.db.database import connect
          from app.db.metadata import init_metadata_db
          with connect() as conn:
              init_metadata_db(conn)
              conn.commit()
          print('METADATA SCHEMA | OK')
          PY

      - name: Preflight episodios pendientes
        env:
          DATABASE_PATH: data/iptv_manager.db
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          python - <<'PY'
          import sqlite3, os
          db=os.environ['DATABASE_PATH']
          limit=int(os.environ.get('INPUT_LIMIT', '200'))
          with sqlite3.connect(db) as con:
              active=con.execute('SELECT COUNT(*) FROM episodes WHERE is_active=1').fetchone()[0]
              pending=con.execute('''
                  SELECT COUNT(*)
                  FROM episodes e
                  JOIN seasons s ON s.id=e.season_id
                  JOIN content c ON c.id=s.series_id
                  LEFT JOIN episode_metadata em ON em.episode_id=e.id
                  WHERE e.is_active=1 AND c.is_active=1 AND em.episode_id IS NULL
              ''').fetchone()[0]
          print(f'PREFLIGHT | active_episodes={active} | pending_episodes={pending} | batch_limit={limit}')
          if active > 0 and pending == 0:
              print('No hay episodios pendientes: el enriquecimiento ya está completo.')
          PY

      - name: Enrich TMDB episodes
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_LANGUAGE: es-ES
          DATABASE_PATH: data/iptv_manager.db
        run: python scripts/enrich_tmdb_episodes.py --limit ${{ inputs.limit }}

      - name: Validate episode metadata
        env:
          DATABASE_PATH: data/iptv_manager.db
        run: python scripts/test_v070_episodes.py

      - name: Resumen BD y guardia de enriquecimiento
        env:
          DATABASE_PATH: data/iptv_manager.db
        run: |
          python - <<'PY'
          import sqlite3, os, sys
          db=os.environ['DATABASE_PATH']
          with sqlite3.connect(db) as con:
              episodes=con.execute('SELECT COUNT(*) FROM episodes WHERE is_active=1').fetchone()[0]
              metadata=con.execute('SELECT COUNT(*) FROM episode_metadata').fetchone()[0]
              pending=con.execute('''
                  SELECT COUNT(*)
                  FROM episodes e
                  JOIN seasons s ON s.id=e.season_id
                  JOIN content c ON c.id=s.series_id
                  LEFT JOIN episode_metadata em ON em.episode_id=e.id
                  WHERE e.is_active=1 AND c.is_active=1 AND em.episode_id IS NULL
              ''').fetchone()[0]
          print(f'CATALOGO | active_episodes={episodes} | episode_metadata={metadata} | pending={pending}')
          if episodes > 0 and metadata == 0 and pending > 0:
              print('ERROR: el enriquecimiento terminó sin generar metadata de episodios.')
              sys.exit(1)
          PY

      - name: Persistir BD enriquecida
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-manager-v070-enriched
          path: data/iptv_manager.db
          if-no-files-found: error
          retention-days: 30
