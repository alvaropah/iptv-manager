name: 07.3 - UI sobre catálogo real v0.4.3

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ui-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar BD persistida con esquema compatible
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data candidates

          REQUIRED_TABLES="content version stream season episode episode_version episode_stream category"

          validate_db() {
            local db="$1"
            [ -f "$db" ] || return 1

            sqlite3 "$db" "PRAGMA integrity_check;" | grep -qx ok || return 1

            local missing
            missing="$(sqlite3 "$db" "SELECT group_concat(name, ' ') FROM sqlite_master WHERE type='table' AND name IN ('content','version','stream','season','episode','episode_version','episode_stream','category');")"
            for table in $REQUIRED_TABLES; do
              echo "$missing" | grep -qw "$table" || return 1
            done
            return 0
          }

          try_run() {
            local workflow="$1"
            local limit="$2"

            echo "Buscando ejecuciones exitosas de: $workflow"
            mapfile -t RUN_IDS < <(
              gh run list \
                --workflow "$workflow" \
                --status success \
                --limit "$limit" \
                --json databaseId \
                --jq '.[].databaseId'
            )

            for RUN_ID in "${RUN_IDS[@]}"; do
              [ -n "$RUN_ID" ] || continue
              echo "Probando ejecución: $RUN_ID"
              rm -rf candidates/*
              if gh run download "$RUN_ID" --name iptv-manager-v031-catalog --dir candidates 2>/dev/null; then
                if validate_db "candidates/iptv_manager.db"; then
                  echo "BD COMPATIBLE encontrada en ejecución $RUN_ID"
                  cp candidates/iptv_manager.db data/iptv_manager.db
                  return 0
                fi
                echo "Artifact $RUN_ID no tiene el esquema requerido; se continúa."
              fi
            done
            return 1
          }

          if ! try_run "03-1-sync-persistent.yml" 10; then
            echo "No se encontró una BD compatible en v0.3.1."
            echo "Probando fallback en v0.3..."
            mapfile -t RUN_IDS < <(
              gh run list \
                --workflow "06-sync-catalog-v03.yml" \
                --status success \
                --limit 10 \
                --json databaseId \
                --jq '.[].databaseId'
            )

            for RUN_ID in "${RUN_IDS[@]}"; do
              [ -n "$RUN_ID" ] || continue
              echo "Probando ejecución v0.3: $RUN_ID"
              rm -rf candidates/*
              if gh run download "$RUN_ID" --name iptv-manager-v03-catalog --dir candidates 2>/dev/null; then
                if validate_db "candidates/iptv_manager.db"; then
                  echo "BD COMPATIBLE encontrada en ejecución $RUN_ID"
                  cp candidates/iptv_manager.db data/iptv_manager.db
                  break
                fi
              fi
            done
          fi

          test -f data/iptv_manager.db
          echo "BD restaurada: $(du -h data/iptv_manager.db | cut -f1)"
          echo "Comprobando esquema compatible..."
          sqlite3 data/iptv_manager.db ".tables"
          validate_db data/iptv_manager.db
          echo "SQLite integrity_check + esquema: OK"

      - name: Validar UI contra catálogo real
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_PATH: data/iptv_manager.db
        run: python scripts/test_ui_real.py
