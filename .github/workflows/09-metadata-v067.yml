name: 09 - Metadata & Matching v0.6.8
run-name: Metadata & Matching v0.6.8

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Número de contenidos a analizar'
        required: false
        default: '100'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      TMDB_LANGUAGE: es-ES
      DATABASE_PATH: data/iptv_manager.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Restaurar BD persistente
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data candidates
          mkdir -p data candidates
          for run in $(gh run list --workflow 03-1-sync-persistent.yml --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
            rm -rf candidates/*
            if gh run download "$run" --name iptv-manager-v031-catalog --dir candidates >/dev/null 2>&1; then
              db=$(find candidates -type f -name '*.db' -print -quit || true)
              if [ -n "$db" ]; then cp "$db" data/iptv_manager.db; break; fi
            fi
          done
          test -s data/iptv_manager.db
          echo "BD restaurada: $(du -h data/iptv_manager.db | cut -f1)"
      - name: Pruebas deterministas v0.6.8
        run: python scripts/test_v067_matching.py
      - name: Validar arquitectura v0.6.8
        run: python scripts/test_v06_metadata.py
      - name: Migrar metadata_links v0.6.8
        run: python scripts/migrate_v068_metadata_links.py
      - name: Enriquecimiento TMDB v0.6.8 — muestra ampliada
        if: ${{ env.TMDB_API_TOKEN != '' }}
        run: python scripts/enrich_tmdb.py --limit ${{ inputs.limit }}
      - name: Validar resultados TMDB v0.6.8
        if: ${{ env.TMDB_API_TOKEN != '' }}
        run: python scripts/test_tmdb_enrichment.py
