name: 07-4 - TMDB + TVmaze Catalog Regression

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum catalog items and episodes to inspect'
        required: true
        default: '250'
        type: string
      diagnostic:
        description: 'Print ranked candidates and fallback diagnostics'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore latest enriched persistent DB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data candidates
          mkdir -p data candidates
          found=0

          validate() {
            DB="$1" python - <<'PY'
          import os, sqlite3, sys
          db=os.environ['DB']
          required={'providers','categories','content','seasons','episodes','versions','streams','series_sources'}
          with sqlite3.connect(db) as con:
              integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
              tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing=required-tables
          print(f'integrity_check={integrity}; missing={sorted(missing)}')
          if integrity!='ok' or missing:
              sys.exit(1)
          PY
          }

          for run in $(gh run list --workflow 07-tmdb-episodes.yml --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
            rm -rf candidates/*
            if gh run download "$run" --name iptv-manager-v070-enriched --dir candidates >/dev/null 2>&1; then
              db=$(find candidates -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit || true)
              if [ -n "$db" ] && validate "$db"; then
                cp "$db" data/iptv_manager.db
                found=1
                echo "DB restored from 07-tmdb-episodes run=$run"
                break
              fi
            fi
          done

          if [ "$found" -eq 0 ]; then
            for run in $(gh run list --workflow 03-1-sync-persistent.yml --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
              rm -rf candidates/*
              if gh run download "$run" --name iptv-manager-v031-catalog --dir candidates >/dev/null 2>&1; then
                db=$(find candidates -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit || true)
                if [ -n "$db" ] && validate "$db"; then
                  cp "$db" data/iptv_manager.db
                  found=1
                  echo "DB restored from 03-1-sync-persistent run=$run"
                  break
                fi
              fi
            done
          fi

          test "$found" -eq 1
          echo "DB restored: $(du -h data/iptv_manager.db | cut -f1)"

      - name: Init metadata schema
        env:
          DATABASE_PATH: data/iptv_manager.db
        run: |
          python - <<'PY'
          from app.db.database import connect
          from app.db.metadata import init_metadata_db
          with connect() as conn:
              init_metadata_db(conn)
              conn.commit()
          PY

      - name: Run TMDB catalog matching
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_LANGUAGE: es-ES
          DATABASE_PATH: data/iptv_manager.db
        run: |
          set -euo pipefail
          ARGS="--limit ${{ inputs.limit }}"
          if [ "${{ inputs.diagnostic }}" = "true" ]; then ARGS="$ARGS --diagnostic"; fi
          python scripts/enrich_tmdb.py $ARGS

      - name: Run TMDB episode enrichment with TVmaze fallback
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_LANGUAGE: es-ES
          DATABASE_PATH: data/iptv_manager.db
        run: |
          set -euo pipefail
          ARGS="--limit ${{ inputs.limit }} --refresh"
          if [ "${{ inputs.diagnostic }}" = "true" ]; then ARGS="$ARGS --diagnostic"; fi
          python scripts/enrich_tmdb_episodes.py $ARGS

      - name: Final regression summary
        env:
          DATABASE_PATH: data/iptv_manager.db
        run: |
          python - <<'PY'
          import sqlite3
          db='data/iptv_manager.db'
          with sqlite3.connect(db) as con:
              integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
              links=con.execute("SELECT external_source, match_status, COUNT(*) FROM metadata_links GROUP BY external_source, match_status ORDER BY external_source, match_status").fetchall()
              episode_sources=con.execute("SELECT source, COUNT(*) FROM episode_metadata WHERE source IS NOT NULL GROUP BY source ORDER BY source").fetchall()
          print(f'FINAL | sqlite_integrity={integrity}')
          print(f'FINAL | metadata_links={links}')
          print(f'FINAL | episode_sources={episode_sources}')
          if integrity != 'ok':
              raise SystemExit(1)
          PY
