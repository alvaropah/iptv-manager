name: "04 - Perfiles de categorías"
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ejecutar prueba 4
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/test_category_profiles.py
