name: "05.2 - Identidad y variaciones de títulos"
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ejecutar prueba 5.2
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/test_title_identity.py
