name: 07-1 - TMDB Series Diagnostic
run-name: TMDB Series Diagnostic ${{ inputs.series_id }}

on:
  workflow_dispatch:
    inputs:
      series_id:
        description: 'ID de serie en la BD (ej. Arpo = 9765)'
        required: true
        default: '9765'
        type: string
      limit:
        description: 'Máximo de episodios a analizar'
        required: false
        default: '200'
        type: string
      refresh:
        description: 'Forzar reprocesado de episodios ya enriquecidos'
        required: false
        default: true
        type: boolean
      diagnostic:
        description: 'Mostrar candidatos y señales de matching'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restaurar BD persistente
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data candidates
          mkdir -p data candidates
          found=0
          validate() {
            DB="$1" python - <<'PY'
          import os, sqlite3, sys
          db=os.environ['DB']
          required={'providers','categories','content','seasons','episodes','versions','streams','series_sources'}
          with sqlite3.connect(db) as con:
              integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
              tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing=required-tables
          print(f'integrity_check={integrity}; missing={sorted(missing)}')
          if integrity!='ok' or missing: sys.exit(1)
          PY
          }
          for run in $(gh run list --workflow 07-tmdb-episodes.yml --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
            rm -rf candidates/*
            echo "Probando enriquecimiento persistente: $run"
            if gh run download "$run" --name iptv-manager-v070-enriched --dir candidates >/dev/null 2>&1; then
              db=$(find candidates -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit || true)
              if [ -n "$db" ] && validate "$db"; then
                cp "$db" data/iptv_manager.db
                found=1
                break
              fi
            fi
          done
          if [ "$found" -eq 0 ]; then
            for run in $(gh run list --workflow 03-1-sync-persistent.yml --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
              rm -rf candidates/*
              echo "Probando catálogo persistente: $run"
              if gh run download "$run" --name iptv-manager-v031-catalog --dir candidates >/dev/null 2>&1; then
                db=$(find candidates -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit || true)
                if [ -n "$db" ] && validate "$db"; then
                  cp "$db" data/iptv_manager.db
                  found=1
                  break
                fi
              fi
            done
          fi
          test "$found" -eq 1
          echo "BD restaurada: $(du -h data/iptv_manager.db | cut -f1)"

      - name: Inicializar esquema de metadata
        env:
          DATABASE_PATH: data/iptv_manager.db
        run: |
          python - <<'PY'
          from app.db.database import connect
          from app.db.metadata import init_metadata_db
          with connect() as conn:
              init_metadata_db(conn)
              conn.commit()
          print('METADATA SCHEMA | OK')
          PY

      - name: Diagnóstico de una sola serie
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_LANGUAGE: es-ES
          DATABASE_PATH: data/iptv_manager.db
          SERIES_ID: ${{ inputs.series_id }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          args=(--series-id "$SERIES_ID" --limit "$INPUT_LIMIT")
          if [ "${{ inputs.refresh }}" = "true" ]; then args+=(--refresh); fi
          if [ "${{ inputs.diagnostic }}" = "true" ]; then args+=(--diagnostic); fi
          echo "DIAGNOSTIC | series_id=$SERIES_ID | limit=$INPUT_LIMIT | refresh=${{ inputs.refresh }} | diagnostic=${{ inputs.diagnostic }}"
          python scripts/enrich_tmdb_episodes.py "${args[@]}"

      - name: Resumen diagnóstico
        if: always()
        env:
          DATABASE_PATH: data/iptv_manager.db
          SERIES_ID: ${{ inputs.series_id }}
        run: |
          python - <<'PY'
          import sqlite3, os
          db=os.environ['DATABASE_PATH']
          sid=int(os.environ['SERIES_ID'])
          with sqlite3.connect(db) as con:
              series=con.execute('SELECT id, canonical_title, is_active FROM content WHERE id=?', (sid,)).fetchone()
              total=con.execute('''SELECT COUNT(*) FROM episodes e JOIN seasons s ON s.id=e.season_id WHERE s.series_id=? AND e.is_active=1''', (sid,)).fetchone()[0]
              metadata=con.execute('''SELECT COUNT(*) FROM episode_metadata em JOIN episodes e ON e.id=em.episode_id JOIN seasons s ON s.id=e.season_id WHERE s.series_id=? AND e.is_active=1''', (sid,)).fetchone()[0]
          print(f'SERIES | id={sid} | title={series[1] if series else "UNKNOWN"} | active={series[2] if series else None}')
          print(f'EPISODES | total={total} | metadata={metadata} | pending={total-metadata}')
          PY
