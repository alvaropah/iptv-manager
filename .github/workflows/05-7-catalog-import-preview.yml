name: "05.7 - Preview de importación del catálogo"

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Ejecutar preview de importación
        env:
          PYTHONPATH: ${{ github.workspace }}
          XTREAM_HOST: ${{ secrets.XTREAM_HOST }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: python scripts/test_catalog_import_preview.py
