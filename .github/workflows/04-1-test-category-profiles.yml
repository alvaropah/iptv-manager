name: "04.1 - Verificación perfiles de categorías"
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Ejecutar casos corregidos
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/test_category_profile_cases.py

      - name: Ejecutar prueba completa de categorías
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/test_category_profiles.py
