name: "07.2 - Primera interfaz web v0.4.2"

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ejecutar prueba de interfaz
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_PATH: data/ui_test.db
        run: python scripts/test_web_ui.py
