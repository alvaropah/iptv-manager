name: "IPTV Manager v0.3.1 - Sincronización persistente"

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Restaurar catalog.db anterior
        uses: actions/download-artifact@v4
        with:
          name: iptv-manager-catalog-db
          path: data
          merge-multiple: true
        continue-on-error: true
      - name: Sincronizar catálogo incremental
        env:
          PYTHONPATH: ${{ github.workspace }}
          XTREAM_HOST: ${{ secrets.XTREAM_HOST }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: python scripts/sync_catalog.py
      - name: Persistir catalog.db
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-manager-catalog-db
          path: data/catalog.db
          if-no-files-found: warn
          retention-days: 90
